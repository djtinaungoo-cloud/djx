<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJX — Feel The Frequency</title>
  <script>
    // SPA redirect for GitHub Pages
    // When GitHub Pages serves this 404.html for a sub-path,
    // we store the intended URL and redirect to the root.
    // The root index.html then reads the stored URL and restores it via history API.
    sessionStorage.redirect = window.location.href;
    var base = window.location.origin;
    // If deployed to a repo sub-path (e.g. /djx/), adjust below:
    window.location.replace(base + '/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
